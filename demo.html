:root{color-scheme:light dark}
body{font-family:-apple-system,system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.5}
h1{font-size:22px;margin-bottom:4px}.sub{color:#888;margin-top:0}
textarea{width:100%;height:120px;font-size:22px;padding:14px;border:1px solid #999;border-radius:10px;box-sizing:border-box;background:Canvas;color:CanvasText}
.crypt{font-family:"Cryptonote",monospace;letter-spacing:.5px}
.row{display:flex;gap:10px;align-items:center;margin:14px 0}

<h1>Cryptonote <span class="pill" id="mode">CRYPT ON</span></h1>
<p class="sub">Type below. The screen shows scrambled glyphs — but the real characters underneath never change.</p>

<label>What you type (on screen)</label>
<textarea id="ta" class="crypt" placeholder="how many money does elon musk has">how many money does elon musk has</textarea>

<div class="row">
  <button id="toggle">Toggle Crypt mode</button>
  <button id="copy">Copy REAL text</button>
</div>

<label>What every app / search engine actually receives</label>
<div class="box"><code id="mirror"></code></div>

<label style="margin-top:14px;display:block">What a shoulder-surfer sees on your screen</label>
<div class="box crypt" id="shown" style="font-size:20px"></div>

<script>
const ta=document.getElementById('ta'),mirror=document.getElementById('mirror'),
shown=document.getElementById('shown'),modeEl=document.getElementById('mode');
let crypt=true;
function refresh(){ mirror.textContent = ta.value || '(empty)'; shown.textContent = ta.value || '…'; }
ta.addEventListener('input',refresh);
document.getElementById('toggle').onclick=()=>{
  crypt=!crypt; ta.classList.toggle('crypt',crypt);
  modeEl.textContent = crypt?'CRYPT ON':'CRYPT OFF'; modeEl.style.background=crypt?'#2a7':'#888';
};
document.getElementById('copy').onclick=async()=>{ await navigator.clipboard.writeText(ta.value);
  const b=document.getElementById('copy'); b.textContent='Copied real text ✓'; setTimeout(()=>b.textContent='Copy REAL text',1200); };
refresh();
</script></body></html>
