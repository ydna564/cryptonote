<h1>Cryptonote <span class="pill" id="mode">CRYPT ON</span></h1>
<p class="sub">Type in any Latin, Greek or Cyrillic language. The screen scrambles; the real characters underneath never change.</p>

<label>What you type (on screen)</label>
<textarea id="ta" class="crypt">how many money does elon musk has
cuánto dinero tiene
сколько денег
πόσα χρήματα</textarea>

<div class="row">
  <button id="toggle">Toggle Crypt mode</button>
  <button id="copy">Copy REAL text</button>
</div>

<label>What every app / search engine actually receives</label>
<div class="box"><code id="mirror"></code></div>

<script>
const ta=document.getElementById('ta'),mirror=document.getElementById('mirror'),modeEl=document.getElementById('mode');
let crypt=true;
function refresh(){ mirror.textContent = ta.value || '(empty)'; }
ta.addEventListener('input',refresh);
document.getElementById('toggle').onclick=()=>{ crypt=!crypt; ta.classList.toggle('crypt',crypt);
  modeEl.textContent = crypt?'CRYPT ON':'CRYPT OFF'; modeEl.style.background=crypt?'#2a7':'#888'; };
document.getElementById('copy').onclick=async()=>{ await navigator.clipboard.writeText(ta.value);
  const b=document.getElementById('copy'); b.textContent='Copied real text'; setTimeout(()=>b.textContent='Copy REAL text',1200); };
refresh();
</script></body></html>
